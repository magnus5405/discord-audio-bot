[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-audio-bot"
version = "0.1.0"
description = "A Discord voice-channel conversational character bot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Magnus5405", email = "magnus@5405.dk"}
]

dependencies = [
    # ``discord-ext-voice-recv`` pulls ``discord.py[voice]`` (PyNaCl<1.6). Do not pin PyNaCl>=1.6 or resolution fails.
    "discord.py>=2.7.1",
    # Newer discord.py 2.7+ requires a current voice_recv alpha (older pins need discord.py<2.4).
    "discord-ext-voice-recv>=0.5.2a179",
    "davey>=0.1.5",
    
    # Transcription
    "google-cloud-speech>=2.38.0",
    
    # GenAI / Conversation
    "google-genai>=1.72.0",
    
    # Text-to-Speech
    "elevenlabs>=2.42.0",
    
    # TUI
    "textual>=8.2.3",
    
    # Environment variables
    "python-dotenv>=1.2.2",
    
    # Audio processing
    "PyNaCl>=1.6.2,<1.7",  # Must match discord.py ``[voice]`` extra (``discord-ext-voice-recv`` requires voice)
    "pydub>=0.25.1",  # Audio manipulation
    
    # Voice Activity Detection (PyPI: ``webrtcvad``, not ``webrtc-vad``; 2.x is current)
    "webrtcvad>=2.0.10",
    
    # Utilities
    "pydantic>=2.12.5",  # Data validation
    "httpx>=0.28.1",  # Async HTTP client for ElevenLabs
    "cryptography>=46.0.7",  # Optional Fernet encryption for secrets in settings.json
]

[project.scripts]
discord-audio-bot = "src.main:main"

[project.optional-dependencies]
build = [
    "pyinstaller>=6.19.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "black>=26.3.1",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
    "isort>=8.0.1",
]

[project.urls]
Homepage = "https://github.com/Magnus5405/discord-audio-bot"
Repository = "https://github.com/Magnus5405/discord-audio-bot.git"
Issues = "https://github.com/Magnus5405/discord-audio-bot/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
# Third-party / dynamic boundaries (discord patches, JSON settings, Textual) until typed further.
disable_error_code = [
    "override",
    "attr-defined",
    "assignment",
    "call-overload",
    "arg-type",
    "no-any-return",
    "no-untyped-def",
    "no-untyped-call",
    "unused-ignore",
    "type-arg",
    "untyped-decorator",
    # Third-party packages without stubs/py.typed (e.g. pydub).
    "import-untyped",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true
