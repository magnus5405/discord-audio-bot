name: Integration

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

# Pushing to `main` and syncing a same-repo PR whose head is `main` (e.g. main → latest) would
# run this workflow twice for one commit. Skip the redundant pull_request run; fork PRs still run
# because head.repo differs from github.repository.
jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'main'
    uses: ./.github/workflows/job-lint.yml

  typecheck:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'main'
    uses: ./.github/workflows/job-typecheck.yml

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || github.head_ref != 'main'
    uses: ./.github/workflows/job-test.yml
