name: Integration

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

# Same commit often triggers both push (e.g. to main) and pull_request (e.g. main → latest).
# Key by PR head SHA when applicable, else the pushed commit, so overlapping runs cancel.
concurrency:
  group: integration-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/job-lint.yml

  typecheck:
    uses: ./.github/workflows/job-typecheck.yml

  test:
    uses: ./.github/workflows/job-test.yml
