name: Release

on:
  push:
    branches:
      - latest
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  build-windows-tui:
    uses: ./.github/workflows/job-build-windows-tui.yml
    secrets: inherit

  publish-github-release:
    if: github.ref == 'refs/heads/latest'
    needs: build-windows-tui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag name
        id: rel
        run: |
          VERSION=$(sed -nE 's/^version = "([^"]+)".*/\1/p' pyproject.toml | head -n1)
          test -n "$VERSION"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub deployment
        id: deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ github.token }}
          environment: github-release
          environment-url: https://${{ vars.DOMAIN }}

      - uses: actions/download-artifact@v8
        with:
          name: discord-audio-bot-tui-windows

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            DiscordAudioBotTUI-Setup.exe
            DiscordAudioBotTUI-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update deployment status (success)
        if: success() && steps.deployment.outputs.deployment_id
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: https://${{ vars.DOMAIN }}

      - name: Update deployment status (failure)
        if: failure() && steps.deployment.outputs.deployment_id
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure
          environment-url: https://${{ vars.DOMAIN }}
