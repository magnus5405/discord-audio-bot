name: Reusable Windows TUI build

on:
  workflow_call:
    secrets:
      SETTINGS_SECRET_KEY:
        description: >-
          Optional Fernet key. When unset, the job generates a throwaway key for the build environment only
          (not embedded in the app). Set the repo secret to match your .env if a build step must decrypt real settings.
        required: false

jobs:
  build-windows-tui:
    runs-on: windows-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create GitHub deployment
        id: deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ github.token }}
          environment: windows-tui
          environment-url: https://${{ vars.DOMAIN }}

      - name: Install project and PyInstaller
        run: pip install -e ".[build]" --pre

      - name: Ensure SETTINGS_SECRET_KEY for build env
        shell: pwsh
        run: |
          $raw = "${{ secrets.SETTINGS_SECRET_KEY }}"
          if ([string]::IsNullOrWhiteSpace($raw)) {
            $k = python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
            "SETTINGS_SECRET_KEY=$k" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "SETTINGS_SECRET_KEY=$raw" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: PyInstaller (onedir, FFmpeg bundled via spec)
        run: python -m PyInstaller packaging/discord-audio-bot-tui.spec --noconfirm

      - name: Zip portable distribution
        shell: pwsh
        run: |
          $zip = "DiscordAudioBotTUI-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "dist/DiscordAudioBotTUI" -DestinationPath $zip

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: cmd

      - name: Compile installer (Inno Setup)
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\DiscordAudioBotTUI.iss

      - name: Stage artifacts at repo root
        shell: pwsh
        run: |
          Copy-Item "build/installer-output/DiscordAudioBotTUI-Setup.exe" "DiscordAudioBotTUI-Setup.exe" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: discord-audio-bot-tui-windows
          path: |
            DiscordAudioBotTUI-Setup.exe
            DiscordAudioBotTUI-windows.zip

      - name: Update deployment status (success)
        if: success() && steps.deployment.outputs.deployment_id
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: https://${{ vars.DOMAIN }}

      - name: Update deployment status (failure)
        if: failure() && steps.deployment.outputs.deployment_id
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure
          environment-url: https://${{ vars.DOMAIN }}
